<script>
  // Eases toward 90%, jumps to 100% on first Flutter frame.
  var progress = 0,
      bar = document.getElementById('progress'),
      pct = document.getElementById('pct');

  function paint() {
    if (bar) bar.style.width = progress + '%';
    if (pct) pct.textContent = Math.round(progress) + '%';
  }

  var timer = setInterval(function () {
    progress += (90 - progress) * 0.1;
    paint();
  }, 80);

  var hidden = false;
  function hideLoader() {
    if (hidden) return;
    hidden = true;
    clearInterval(timer);
    progress = 100;
    paint();
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 450);
      }
    }, 150);
  }
  window.addEventListener('flutter-first-frame', hideLoader);
  // Fallback only if something goes wrong; long enough for slow mobile networks.
  setTimeout(hideLoader, 12000);
</script>
